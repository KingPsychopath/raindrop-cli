<svg width="960" height="320" viewBox="0 0 960 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Inspect, suggest, review and apply</title>
  <desc id="desc">An example reviewed plan adds a reference tag and moves a Go HTTP reference bookmark to Reference, preserving its personal tag and notes. Review the exact changes and dry-run before applying.</desc>
  <rect width="960" height="320" rx="18" fill="#101820"/>
  <rect x="24" y="24" width="912" height="272" rx="14" fill="#0B1117" stroke="#26313D"/>
  <rect x="24" y="24" width="912" height="48" rx="14" fill="#17212B"/>
  <circle cx="52" cy="48" r="7" fill="#FF5F57"/>
  <circle cx="76" cy="48" r="7" fill="#FFBD2E"/>
  <circle cx="100" cy="48" r="7" fill="#28C840"/>
  <g font-family="Menlo, Consolas, monospace">
    <text x="132" y="54" fill="#9FB0C3" font-size="15">rdrop - Review before you apply</text>
    <g stroke="#26313D"><path d="M324 100V226"/><path d="M628 100V226"/><path d="M48 246H912"/></g>
    <g fill="#5EEAD4" font-size="18"><text x="48" y="116">01 Inspect</text><text x="352" y="116">02 Suggest</text><text x="656" y="116">03 Review &amp; apply</text></g>
    <g font-size="16">
      <text x="48" y="156" fill="#E6EDF3">Go HTTP reference</text>
      <text x="48" y="186" fill="#C9D1D9">tag: personal</text>
      <text x="48" y="216" fill="#C9D1D9">folder: Unsorted</text>
      <text x="352" y="156" fill="#A7F3D0">add: reference</text>
      <text x="352" y="186" fill="#C9D1D9">move: Reference</text>
      <text x="352" y="216" fill="#C9D1D9">keep: personal</text>
      <text x="656" y="156" fill="#E6EDF3">Review 1 bookmark</text>
      <text x="656" y="186" fill="#C9D1D9">Dry-run the exact plan</text>
      <text x="656" y="216" fill="#FDE68A">Apply when approved</text>
      <text x="48" y="276" fill="#9FB0C3">Your tags and notes stay. Uncertain suggestions stay visible.</text>
    </g>
  </g>
</svg>
