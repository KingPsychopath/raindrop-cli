<svg xmlns="http://www.w3.org/2000/svg" width="960" height="248" viewBox="0 0 960 248" role="img" aria-labelledby="title desc">
  <title id="title">Your links, your rules, a reviewed library</title>
  <desc id="desc">Find saved links, review suggested tags and collections, then apply the exact changes while preserving existing tags.</desc>
  <rect width="960" height="248" rx="20" fill="#0e1525"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="32" y="40" fill="#f2f6ff" font-size="18" font-weight="650">A library that still feels like yours.</text>
    <g fill="#172238" stroke="#2b3a55"><rect x="32" y="65" width="270" height="151" rx="14"/><rect x="345" y="65" width="270" height="151" rx="14"/><rect x="658" y="65" width="270" height="151" rx="14"/></g>
    <g fill="#8fbaff" font-size="12" font-weight="700"><text x="52" y="94">01 / FIND</text><text x="365" y="94">02 / REVIEW</text><text x="678" y="94">03 / ORGANIZE</text></g>
    <g fill="#f2f6ff" font-size="20" font-weight="650"><text x="52" y="125">See what you saved</text><text x="365" y="125">Make the choices yours</text><text x="678" y="125">Apply what you approved</text></g>
    <g fill="#b5c3d9" font-size="14"><text x="52" y="153">Search links and collections.</text><text x="52" y="175">Find gaps in your library.</text><text x="365" y="153">Use existing tags and folders.</text><text x="365" y="175">Keep uncertain ideas visible.</text><text x="678" y="153">Check the exact changes first.</text><text x="678" y="175">Keep existing tags and notes.</text></g>
    <g fill="#91d7bc" font-size="12"><text x="52" y="199">Shell or your favorite agent</text><text x="365" y="199">Local models or hosted AI</text><text x="678" y="199">A plan you can inspect</text></g>
    <g stroke="#7a91b2" stroke-width="2" fill="none"><path d="M314 141h19m-6-6 6 6-6 6"/><path d="M627 141h19m-6-6 6 6-6 6"/></g>
  </g>
</svg>
