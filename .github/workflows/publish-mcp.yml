name: Publish MCP Registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release version, without v
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mcp-registry-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ inputs.version }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify published npm packages against the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release download "v$RELEASE_VERSION" --dir dist --pattern '*.tgz' --pattern checksums.txt
          node scripts/verify-npm-release.mjs "$RELEASE_VERSION" dist
      - name: Install verified registry publisher
        run: |
          curl --fail --location --retry 2 --output publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  publisher.tar.gz' | sha256sum --check
          tar -xzf publisher.tar.gz mcp-publisher
      - name: Authenticate with short-lived GitHub identity
        run: ./mcp-publisher login github-oidc
      - name: Validate registry metadata
        run: ./mcp-publisher validate server.json
      - name: Publish registry metadata
        run: ./mcp-publisher publish server.json
