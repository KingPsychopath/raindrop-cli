name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - run: git diff --exit-code
      - run: go test -race ./...
  platforms:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: integrations/executor/package-lock.json
      - run: npm ci --ignore-scripts --prefix integrations/executor
      - run: make check-integrations
      - run: node scripts/build-npm.mjs 0.0.0-ci
      - run: node scripts/pack-npm.mjs
      - run: node scripts/smoke-npm.mjs
      - run: docker build -t rdrop:ci .
      - run: docker run --rm rdrop:ci version
      - run: docker run --rm rdrop:ci mcp tools
