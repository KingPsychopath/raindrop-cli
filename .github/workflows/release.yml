name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: integrations/executor/package-lock.json
      - run: make check
      - run: npm ci --ignore-scripts --prefix integrations/executor
      - run: make check-integrations
      - run: git diff --exit-code
      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          node scripts/release-readme.mjs "${version}" dist/README.md

          platforms=(
            "darwin/amd64"
            "darwin/arm64"
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          for platform in "${platforms[@]}"; do
            IFS=/ read -r goos goarch <<< "${platform}"
            artifact_os="${goos}"
            if [ "${goos}" = "darwin" ]; then
              artifact_os="macos"
            fi
            name="rdrop_${version}_${artifact_os}_${goarch}"
            binary="rdrop"

            if [ "${goos}" = "windows" ]; then
              binary="rdrop.exe"
            fi

            mkdir -p "dist/${name}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath \
                -ldflags="-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA} -X main.date=${build_date}" \
                -o "dist/${name}/${binary}" ./cmd/rdrop
            cp dist/README.md LICENSE "dist/${name}/"

            if [ "${goos}" = "windows" ]; then
              (cd dist && zip -qr "${name}.zip" "${name}")
            else
              tar -czf "dist/${name}.tar.gz" -C dist "${name}"
            fi

            rm -rf "dist/${name}"
          done

      - name: Build npm release artifacts
        run: |
          node scripts/build-npm.mjs "${GITHUB_REF_NAME#v}"
          node scripts/pack-npm.mjs
          node scripts/smoke-npm.mjs
          node scripts/pack-plugin.mjs "${GITHUB_REF_NAME#v}"
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip *.tgz > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.zip dist/*.tgz dist/checksums.txt \
            --title "raindrop-cli ${GITHUB_REF_NAME}" \
            --generate-notes
